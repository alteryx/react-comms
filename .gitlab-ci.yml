image: "artifactory.alteryx.com/docker/node:20-alpine"

include:
  - project: "automation/gitlab-jobs"
    ref: v1.8.3
    file: "/sonarqube.yml"
  - project: AppSec/snyk_scanning
    ref: v0.0.1
    file: Snyk_Container.gitlab-ci.yml
  - project: devops/shared-gitlab-jobs
    ref: v1.4.2
    file: /docker.yml
  - component: $CI_SERVER_FQDN/futurama/zoidberg/ci-catalog/semver-utils/conventional-commit@0.0.20
  - project: high-five/templates/shared-gitlab-jobs
    ref: master
    file: veracode.gitlab-ci.yml

stages:
  - lint
  - test-coverage
  - build
  - sonarscan
  - veracode
  - build-docs
  - publish
  - pages

cache:
  paths:
    - packages/components/node_modules/
    - packages/docs/node_modules/
    
veracode-portal-scan:
  stage: veracode
  extends: [.veracode-portal-scan]
  before_script:
    - tar -czvf veracodeBall.tgz packages/components/build
  variables:
    COMPRESSED_CODE: veracodeBall.tgz
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always

test-sdk:
  stage: test-coverage
  tags:
    - linux-docker
  script:
    - cd packages/components
    - npm i && npm run test
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  artifacts:
    when: always
    expire_in: 1h
    paths:
      - packages/components/coverage/
  rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        when: always
      - if: '$CI_COMMIT_BRANCH == "main"'
        when: always

build:
  stage: build
  tags:
    - linux-docker
  script:
    - cd packages/components
    - npm ci && npm run build:publish
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always

bump-version:
  extends: .bump-version-npm
  stage: publish
  needs: []
  variables:
      GITLAB_WRITE_TOKEN: $GITLAB_TOKEN
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish-main:
  stage: publish
  needs: [test-sdk, build, bump-version]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  tags:
    - linux-docker
  script:
    - export VERSION=$(node -p "require('./package.json').version")
    - cd packages/components
    - npm ci
    - echo registry=https://artifactory.alteryx.com/artifactory/api/npm/npm/ > .npmrc
    - echo //artifactory.alteryx.com/artifactory/api/npm/npm/:_auth=$ARTIFACTORY_AUTH >> .npmrc
    - echo email = $ARTIFACTORY_EMAIL>>.npmrc
    - echo always-auth = true>>.npmrc
    - npm run build:publish
    - npm publish ./build

publish-branch:
  stage: publish
  when: manual
  needs: [test-sdk, build]
  tags:
    - linux-docker
  variables:
    GITLAB_TOKEN: $REMOTE_PUSH_USER_TOKEN
  script:
    - cd packages/components
    - npm ci
    - echo registry=https://artifactory.alteryx.com/artifactory/api/npm/npm/ > .npmrc
    - echo //artifactory.alteryx.com/artifactory/api/npm/npm/:_auth=$ARTIFACTORY_AUTH >> .npmrc
    - echo email = $ARTIFACTORY_EMAIL>>.npmrc
    - echo always-auth = true>>.npmrc
    - npm --no-git-tag-version version 0.0.0-$CI_COMMIT_REF_SLUG.$CI_PIPELINE_ID
    - npm run build:publish
    - npm publish --tag $CI_COMMIT_REF_SLUG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always

sonarqube-check:
  extends: [.sonarqube_scan]
  stage: sonarscan
  needs: ["test-sdk"]
  allow_failure: true
  tags: ["linux-docker"]
  variables:
    SONARQUBE_TOKEN: ${SONAR_TOKEN}
    GIT_DEPTH: 0
    SONAR_PROJECT_BASE_DIR: "${CI_PROJECT_DIR}"
    SONAR_PROJECT_PROPERTIES: sonar-scanner.properties
    SONARQUBE_SCANNER_PROPERTIES: "sonar-scanner.properties"
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
      when: always
    - when: never

build-docs-feature:
  needs: [test-sdk]
  stage: build-docs
  tags:
    - linux-docker
  script:
    - cd packages/docs
    - npm i
    - npm run docs:build
  artifacts:
    paths:
      - packages/docs/styleguide
    expire_in: 1d
      
pages:
  stage: pages 
  tags:
    - linux-docker
  needs:
    - test-sdk
    - build-docs-feature
  script:
    - mv packages/docs/styleguide public
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always



